[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlnogaster"
version = "0.1.0"
description = "Genetic-algorithm feature engineering tools."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "deap",
    "numpy",
    "polars",
]

[tool.setuptools.packages.find]
include = ["mlnogaster*"]
